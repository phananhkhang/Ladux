services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - DB_USERNAME=akira
      - DB_PASSWORD=1234
      # BƠM CÁC CHUỖI MẬT THẬT VÀO ĐÂY KHI DEPLOY PROD
      - JWT_SECRET=YOTyMfKxFu4G4Xov9WiA8YK9Z7UQz9hnZRrAywS+bP8=
      - GOOGLE_CLIENT_ID=405748760225-613mkg03dds24di44e7vpigi62ed06r0.apps.googleusercontent.com
      - GOOGLE_CLIENT_SECRET=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
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - s-network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: akira
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: aura_tech
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akira -d aura_tech"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - s-network

volumes:
  postgres-data:

networks:
  s-network:
    driver: bridge