# Development compose only. Production must use docker-compose.prod.yml.
services:
  app:
    build: .
    env_file:
      - .env
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - DB_USERNAME=${DB_USERNAME:-akira}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in your environment}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in your environment}
      - VNPAY_TMN_CODE=${VNPAY_TMN_CODE}
      - VNPAY_HASH_SECRET=${VNPAY_HASH_SECRET}
      - VNPAY_PAY_URL=${VNPAY_PAY_URL}
      - VNPAY_RETURN_URL=${VNPAY_RETURN_URL}
      - VNPAY_REFUND_URL=${VNPAY_REFUND_URL}
      # Serve seed product images from host ../uploads (bind-mounted below)
      - UPLOAD_ROOT=/app/uploads
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - s-network
    volumes:
      # Project root uploads/ (products, avatars) — not an empty named volume
      - ../uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${DB_USERNAME:-akira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      POSTGRES_DB: ladux
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # First-time initdb on Docker Desktop (Windows) often takes 45–90s.
    # Without start_period, failed checks during init mark the service unhealthy
    # and app never starts (depends_on: service_healthy).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks:
      - s-network
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - s-network
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes

volumes:
  postgres-data:
  redis-data:

networks:
  s-network:
    driver: bridge
