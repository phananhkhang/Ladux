services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DB_HOST=postgres
      - DB_USERNAME=${DB_USERNAME:-akira}
      - DB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      - JWT_SECRET=${JWT_SECRET:?Set JWT_SECRET in your environment}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:?Set GOOGLE_CLIENT_ID in your environment}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:?Set GOOGLE_CLIENT_SECRET in your environment}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - s-network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USERNAME:-akira}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment}
      POSTGRES_DB: aura_tech
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akira -d aura_tech"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - s-network

volumes:
  postgres-data:

networks:
  s-network:
    driver: bridge
