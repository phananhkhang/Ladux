services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
    volumes:
      - ./database:/database
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - s-network

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: akira
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: aura_tech
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akira -d aura_tech"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - s-network

volumes:
  postgres-data:

networks:
  s-network:
    driver: bridge