# TUYỆT ĐỐI KHÔNG TỰ SỬA BẢNG - CHỈ VALIDATE CẤU TRÚC
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Required in production; comma-separated exact origins, e.g. https://ladux.vn,https://admin.ladux.vn.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.cors.production-only=true

# Honor X-Forwarded-* sent by Caddy so redirects and secure cookies retain
# the public HTTPS scheme/domain instead of the internal app:8080 address.
server.forward-headers-strategy=framework

# TUYỆT ĐỐI TẮT TÍNH NĂNG CHẠY FILE DATA.SQL
spring.sql.init.mode=never

app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.device-cookie.secure=${AUTH_DEVICE_COOKIE_SECURE:true}
app.captcha.enabled=${CAPTCHA_ENABLED:true}
app.captcha.secret=${CAPTCHA_SECRET}
app.captcha.expected-hostname=${CAPTCHA_EXPECTED_HOSTNAME}
app.captcha.expected-action=${CAPTCHA_EXPECTED_ACTION:login}
app.mfa.encryption-key=${MFA_ENCRYPTION_KEY}
app.mfa.fixed-code=

payment.vnpay.tmn-code=${VNPAY_TMN_CODE}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET}
payment.vnpay.pay-url=${VNPAY_PAY_URL}
payment.vnpay.return-url=${VNPAY_RETURN_URL}
payment.vnpay.refund-url=${VNPAY_REFUND_URL}

spring.data.redis.host=redis
spring.data.redis.port=6379
spring.cache.type=redis
