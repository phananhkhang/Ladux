# Chọn profile mặc định là 'dev' nếu không cấu hình gì thêm
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Cấu hình chung cho JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# 🌐 Đọc thông tin kết nối DB từ biến môi trường (Dùng chung cho cả dev và prod)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/aura_tech
spring.datasource.username=${DB_USERNAME:akira}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# KHÔNG ĐỂ MẶC ĐỊNH (FALLBACK) CHO CÁC CHUỖI MẬT TRÊN PROD
app.jwt.secret=${JWT_SECRET}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

app.auth.cookie.name=${AUTH_COOKIE_NAME:AUTH_TOKEN}
app.auth.cookie.path=/
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.max-age-seconds=${AUTH_COOKIE_MAX_AGE_SECONDS:36000}
app.oauth2.success-redirect=${OAUTH2_SUCCESS_REDIRECT:http://localhost:3000/checkout/success}

spring.web.resources.static-locations=classpath:/static/

app.upload.root=${UPLOAD_ROOT:uploads}
app.upload.product-dir=products
app.upload.avatar-dir=avatars
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
