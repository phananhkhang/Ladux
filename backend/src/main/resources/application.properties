# Chọn profile mặc định là 'dev' nếu không cấu hình gì thêm
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Cấu hình chung cho JPA
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.type.json_format_mapper=jackson

# Đọc thông tin kết nối DB từ biến môi trường (Dùng chung cho cả dev và prod)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/ladux
spring.datasource.username=${DB_USERNAME:akira}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# KHÔNG ĐỂ MẶC ĐỊNH (FALLBACK) CHO CÁC CHUỖI MẬT TRÊN PROD
app.jwt.secret=${JWT_SECRET}
# Access token song ngan (15 phut), refresh token song dai (7 ngay) - tinh bang mili-giay.
app.jwt.access-expiration=${JWT_ACCESS_EXPIRATION_MS:900000}
app.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION_MS:604800000}

app.auth.cookie.name=${AUTH_COOKIE_NAME:AUTH_TOKEN}
app.auth.cookie.refresh-name=${AUTH_COOKIE_REFRESH_NAME:REFRESH_TOKEN}
app.auth.cookie.path=/
app.auth.cookie.refresh-path=${AUTH_COOKIE_REFRESH_PATH:/api/v1/auth}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Strict}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:false}
app.auth.cookie.max-age-seconds=${AUTH_COOKIE_MAX_AGE_SECONDS:36000}

spring.web.resources.static-locations=classpath:/static/

app.upload.root=${UPLOAD_ROOT:../uploads}
app.upload.product-dir=products
app.upload.avatar-dir=avatar
app.upload.category-dir=categories
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

spring.data.redis.host=localhost
spring.data.redis.port=6379

# Giám sát ứng dụng
# ===== Actuator / Health probes =====
# Chi expose cac endpoint can thiet ra HTTP (tranh lo thong tin nhay cau hinh).
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Bat liveness & readiness probe (dung cho Docker/K8s).
management.endpoint.health.probes.enabled=true
# Chi hien chi tiet health (vd trang thai DB/Redis) cho request da xac thuc.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
# Bao gom DB & Redis vao readiness de container chi "ready" khi phu thuoc san sang.
management.endpoint.health.group.readiness.include=readinessState,db,redis

# ===== Rate limiting dang nhap (bucket4j + Redis) =====
# Gioi han so lan goi POST /api/v1/auth/login theo IP: capacity lan trong moi refill-minutes phut.
app.rate-limit.login.capacity=10
app.rate-limit.login.refill-minutes=1

# Chính sách giao hàng dùng chung cho cart preview và lúc tạo order.
app.order.shipping-fee=${ORDER_SHIPPING_FEE:30000}
app.order.carrier=${ORDER_CARRIER:VNPOST}

# Fixed OTP dùng cho luồng xác thực số điện thoại hiện tại.
app.phone-otp.fixed-code=${PHONE_OTP_FIXED_CODE:123456}

# Mã website do VNPay cấp
vnpay.tmn-code=YOUR_TMN_CODE
# Chuỗi bí mật ký HMACSHA512
vnpay.hash-secret=YOUR_HASH_SECRET
# URL Sandbox
vnpay.refund-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction

twilio.account-sid=${TWILIO_ACCOUNT_SID}
twilio.auth-token=${TWILIO_AUTH_TOKEN}
twilio.verify-service-sid=${TWILIO_VERIFY_SERVICE_SID}


spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Tránh request bị treo quá lâu nếu Gmail lỗi
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.mail.default-encoding=UTF-8

# Cấu hình OTP email
app.email.from=${MAIL_USERNAME}
app.email-otp.expires-in-seconds=300
app.email-otp.resend-cooldown-seconds=60
app.email-otp.max-failed-attempts=5

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

app.oauth2.success-redirect=${OAUTH2_SUCCESS_REDIRECT:http://localhost:5173/auth/oauth2/success}
app.oauth2.failure-redirect=${OAUTH2_FAILURE_REDIRECT:http://localhost:5173/login?oauth2Error=true}
