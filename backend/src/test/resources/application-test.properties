# ============================================================
# Cau hinh rieng cho INTEGRATION TEST (profile "test")
# Datasource (url/user/pass) duoc bom tu Testcontainers o AbstractIntegrationTest.
# ============================================================

# --- Secret GIA, chi dung trong test (KHONG dung that o prod) ---
# JwtService decode BASE64; neu khong hop le se fallback hash SHA-256 -> luon du 32 byte.
app.jwt.secret=dGVzdC1qd3Qtc2VjcmV0LWtleS1mb3ItYXVyYXRlY2gtaW50ZWdyYXRpb24tdGVzdA==
payment.vnpay.secret-key=TEST_VNPAY_SECRET_KEY_DO_NOT_USE_IN_PROD

# --- OAuth2 Google dummy: chi de Spring context khoi dong (khong test luong OAuth that) ---
spring.security.oauth2.client.registration.google.client-id=test-google-client-id
spring.security.oauth2.client.registration.google.client-secret=test-google-client-secret

# --- Schema: Flyway dung (giong prod), Hibernate chi validate ---
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
# Nap ca du lieu mau (devdata) de test co san brand/product/order... (giong moi truong dev).
spring.flyway.locations=classpath:db/migration,classpath:db/devdata

# --- Tat Redis cache trong test de KHONG phu thuoc Redis server ---
# cache.type=none -> @Cacheable/@CacheEvict thanh no-op; ket noi Redis lazy nen khong bi goi.
spring.cache.type=none

app.rate-limit.login.capacity=5
app.rate-limit.login.refill-minutes=1

spring.jpa.show-sql=false
